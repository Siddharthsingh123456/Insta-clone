<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Notes — AI Developer OS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#070a12;color:#eef2ff;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 10%,#263b7433,transparent 30%),radial-gradient(circle at 85% 80%,#6d28d933,transparent 32%);pointer-events:none}
.app{position:relative;max-width:1180px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{font-weight:800;font-size:20px}.brand span{color:#8b5cf6}.badge{padding:7px 11px;border:1px solid #ffffff18;border-radius:999px;color:#aab3cc;font-size:12px;background:#ffffff08}
.grid{display:grid;grid-template-columns:240px 1fr;gap:18px}.card{background:#0d1220dd;border:1px solid #ffffff12;border-radius:20px;box-shadow:0 20px 60px #0005;backdrop-filter:blur(16px)}
.side{padding:18px}.side h3{margin:4px 0 18px}.nav{display:grid;gap:7px}.nav button,.btn{border:1px solid #ffffff12;background:#ffffff07;color:#dce3f7;padding:11px 13px;border-radius:11px;text-align:left;cursor:pointer}.nav button:hover,.btn:hover{background:#ffffff12}.main{padding:26px}.title{font-size:32px;margin:0 0 7px}.sub{color:#9aa5bd;margin:0 0 24px}.row{display:flex;gap:10px;flex-wrap:wrap}.input,textarea,select{width:100%;background:#080c16;color:#eef2ff;border:1px solid #ffffff14;border-radius:12px;padding:12px;outline:none}.input:focus,textarea:focus,select:focus{border-color:#8b5cf6}.primary{background:#7c3aed;border-color:#8b5cf6!important;color:white!important;text-align:center!important}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#8b5cf61c;color:#c4b5fd;font-size:12px}.muted{color:#8d98b2}.box{padding:16px;border:1px solid #ffffff10;border-radius:15px;background:#ffffff05}.list{display:grid;gap:10px}.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{text-align:center}.result{white-space:pre-wrap;line-height:1.6;color:#cbd5e1}.stat{font-size:25px;font-weight:800}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.side{display:none}.two,.three{grid-template-columns:1fr}.title{font-size:26px}}
</style></head><body><div class="app"><div class="top"><div class="brand">AI <span>Developer OS</span></div><div class="badge">AI Notes</div></div><div class="grid"><aside class="card side"><h3>AI Notes</h3><div class="nav"><button>All notes</button><button>Work</button><button>Study</button><button>Projects</button></div></aside><main class="card main"><h1 class="title">Smart Notes</h1><p class="sub">An AI notes workspace with folders, searchable notes, editor, tags, and smart actions.</p><div class="two"><div><input id="title" class="input" placeholder="Note title"><textarea id="note" rows="13" style="margin-top:10px" placeholder="Write your note..."></textarea><div class="actions"><button class="btn primary" onclick="save()">Save note</button><button class="btn" onclick="toast('AI would summarize this note')">Summarize</button></div></div><div class="box"><span class="pill">AI insight</span><h3 id="preview">Untitled note</h3><p id="pv" class="result">Your live note preview will appear here.</p></div></div></main></div><script>$('#title').oninput=()=>$('#preview').textContent=$('#title').value||'Untitled note';$('#note').oninput=()=>$('#pv').textContent=$('#note').value||'Your live note preview will appear here.';function save(){localStorage.setItem('ai-note',$('#note').value);toast('Note saved locally')}</script></div>
<script>
const $=s=>document.querySelector(s); const click=(s,fn)=>{const e=$(s);if(e)e.onclick=fn};
function toast(t){let x=document.createElement('div');x.textContent=t;x.style='position:fixed;bottom:24px;right:24px;padding:12px 16px;background:#161d30;border:1px solid #ffffff18;border-radius:12px;z-index:9';document.body.append(x);setTimeout(()=>x.remove(),1800)}
</script></body></html>
